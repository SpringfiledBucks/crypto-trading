name: klines-regression

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j 2 --target klines_regression
      - name: Run regression
        run: |
          mkdir -p logs
          ./build/klines_regression --output logs/klines_regression_report_cpp.json
      - name: Compare reports
        id: compare
        run: |
          python3 scripts/compare_regression_reports.py logs/klines_regression_report_full.json logs/klines_regression_report_cpp.json || true
      - name: Upload diffs
        uses: actions/upload-artifact@v4
        with:
          name: klines-diffs
          path: |
            logs/klines_diff_summary.csv
            logs/klines_diff_summary.txt
      - name: Remediate on diffs
        if: ${{ steps.compare.outcome == 'failure' || always() && (github.event_name == 'workflow_dispatch') }}
        run: |
          python3 scripts/auto_remediate.py --report logs/klines_regression_report_cpp.json
      - name: Remediate (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 scripts/auto_remediate.py --report logs/klines_regression_report_cpp.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: klines-regression-report
          path: logs/klines_regression_report_cpp.json
