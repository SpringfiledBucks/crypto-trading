name: CI / CD

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libncurses5-dev libncursesw5-dev
      - name: Configure & build
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j
      - name: Run SSE smoke test
        run: |
          cd build
          ../scripts/test_sse.sh -- --timeout 10
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/runtime.log
            logs/crypto_trading.out

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Copy binary and service to remote
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # default deploy path if not set
          DEPLOY_PATH=${DEPLOY_PATH:-/home/${DEPLOY_USER}/crypto-trading}
          ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"
          rsync -avz --chmod=+x build/crypto_trading ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/build/
          # optional: sync systemd unit if present
          if [ -f scripts/crypto_trading.service ]; then
            scp scripts/crypto_trading.service ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          fi
          # restart service (may require sudo on remote)
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} "sudo systemctl daemon-reload || true; sudo systemctl restart crypto_trading.service || true; sudo systemctl status crypto_trading.service --no-pager"

      - name: Confirm deploy
        run: echo "Deployed to ${{ secrets.DEPLOY_HOST }}"
